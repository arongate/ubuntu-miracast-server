name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

jobs:
  # ─── Generate changelog for the release ─────────────────────────────────────
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-24.04
    outputs:
      release_body: ${{ steps.changelog.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog (since last stable release)
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGES.md

  # ─── Build Python package ───────────────────────────────────────────────────
  build-python:
    name: Build Python Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ─── Build Debian package ───────────────────────────────────────────────────
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev debhelper dh-python \
            python3-all python3-setuptools

      - name: Build .deb package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p deb-out
          mv ../*.deb deb-out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: deb-out/*.deb

  # ─── Create GitHub Release ─────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [changelog, build-python, build-deb]
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            artifacts/python-dist/*
            artifacts/debian-package/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
