name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint with Ruff ─────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Ruff
        run: uv pip install ruff --system

      - name: Run Ruff check
        run: ruff check src/ tests/ setup.py

      - name: Check formatting
        run: ruff format --check src/ tests/ setup.py

  # ─── Type checking ─────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gst-1.0 python3-venv \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            libgirepository1.0-dev gcc python3-dev libcairo2-dev pkg-config

      - name: Install mypy
        run: |
          uv venv --system-site-packages
          . .venv/bin/activate
          uv pip install mypy

      - name: Run mypy (advisory)
        run: |
          . .venv/bin/activate
          mypy src/ --ignore-missing-imports || echo "::warning::mypy found type errors (advisory, not blocking)"

  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gst-1.0 python3-venv python3-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libgirepository1.0-dev gcc libcairo2-dev pkg-config

      - name: Install package
        run: |
          uv venv --system-site-packages
          . .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest tests/ --cov=miracast_server --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # ─── Security scanning ─────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install security tools
        run: uv pip install bandit --system

      - name: Run bandit (Python SAST)
        run: bandit -r src/ -ll -ii -c pyproject.toml

      - name: Subprocess safety audit
        run: python3 scripts/check_subprocess_safety.py

  # ─── Commit message lint ────────────────────────────────────────────────────
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.title }}" | commitlint --config <(echo "module.exports = {extends: ['@commitlint/config-conventional']}")

      - name: Lint commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" \
              --config <(echo "module.exports = {extends: ['@commitlint/config-conventional']}")
          else
            commitlint --from "${{ github.event.before }}" --to "${{ github.event.after }}" \
              --config <(echo "module.exports = {extends: ['@commitlint/config-conventional']}") || true
          fi
