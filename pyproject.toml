[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

# ─── Ruff (replaces black + isort + flake8) ──────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (readability preference)
    "SIM105", # use contextlib.suppress (try/except/pass is clearer in our network code)
    "UP007",  # use X | Y for union types (need runtime support)
    "RUF012", # mutable class variable (GObject __gsignals__ requires this pattern)
    "N806",   # variable in function should be lowercase (constants defined in functions)
]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() must be called before importing from gi.repository
"src/miracast_server/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["miracast_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["gi", "gi.repository"]
ignore_missing_imports = true

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

# ─── Bandit (security linting) ────────────────────────────────────────────────

[tool.bandit]
targets = ["src/"]
# Focus on high-impact issues for a privileged application
skips = [
    "B101",  # assert used (fine in non-production code paths)
    "B108",  # hardcoded /tmp paths (intentional for wpa_supplicant control socket)
    "B311",  # random not for crypto (we use it for WPS PINs which are displayed to user)
]

[tool.bandit.assert_used]
skips = ["tests/*"]
